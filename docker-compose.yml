# Production infrastructure profile.
#
# The reference build runs fully in-memory, so you do NOT need this to try FlowForge.
# These are the backing services the production adapters (behind the same interfaces)
# would use. Bring them up with:  docker compose up -d
#
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: flowforge-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flowforge-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  postgres:
    image: postgres:16-alpine
    container_name: flowforge-postgres
    environment:
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: flowforge
      POSTGRES_DB: flowforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  seq:
    image: datalust/seq:latest
    container_name: flowforge-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:5341"     # ingestion
      - "8081:80"       # Seq UI
    volumes:
      - seqdata:/data

volumes:
  pgdata:
  seqdata:
